name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calculadora
          POSTGRES_PASSWORD: calculadora_ci
          POSTGRES_DB: calculadora_fiscal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calculadora -d calculadora_fiscal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Auditoria de dependências de produção (falha em high/critical)
        # Dependências de desenvolvimento têm risco residual documentado em docs/SEGURANCA.md.
        run: npm audit --omit=dev --audit-level=high
      - name: Migrações coerentes com o histórico (drizzle-kit check)
        run: npm run db:check
      - run: npm run typecheck
      - name: Testes (PGlite em memória)
        run: npm test
      - name: Testes de integração contra PostgreSQL real
        # A URL é só a conexão administrativa: cada suíte cria e remove um banco
        # exclusivo cf_test_* (o usuário precisa de CREATEDB). Nada é apagado aqui.
        run: npm test -- --project api
        env:
          TEST_DATABASE_URL: postgres://calculadora:calculadora_ci@localhost:5432/calculadora_fiscal_test
      - run: npm run build
